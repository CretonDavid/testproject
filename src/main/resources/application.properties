spring.application.name=hermes-api

spring.datasource.url=jdbc:postgresql://localhost:5432/hermes-db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.mvc.format.date=iso
spring.jackson.deserialization.fail-on-null-for-primitives=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

application.security.jwt.secret=${JWT_SECRET}
application.security.jwt.issuer=hermes-api
application.security.jwt.access-token-ttl=15m
application.security.jwt.refresh-token-ttl=7d

application.cors.allowed-origins=http://localhost:4200

# Taux de change BCE (service public, sans cle)
application.exchange-rates.provider-url=https://api.frankfurter.dev/v1
# Generation des operations recurrentes : tous les jours a 1h du matin
application.recurring.cron=0 0 1 * * *
