spring.application.name=hermes-api

spring.datasource.url=jdbc:postgresql://localhost:5432/hermes-db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update

application.security.jwt.secret=${JWT_SECRET}
application.security.jwt.issuer=hermes-api
application.security.jwt.access-token-ttl=15m
application.security.jwt.refresh-token-ttl=7d